[package]
name = "titan-megakernel"
version = "0.1.0"
edition = "2021"
authors = ["Julius Cameron Hill <julius@titanuai.com>"]
description = "Hardware-agnostic megakernel schedule IR and static deadlock/race validator"
license = "PROPRIETARY"

[[bin]]
name = "titanmk"
path = "src/main.rs"

[lib]
name = "titanmk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
